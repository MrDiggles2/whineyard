services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ane
      POSTGRES_PASSWORD: ane
      POSTGRES_DB: whineyard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ane -d whineyard"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  web:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://ane:ane@db:5432/whineyard
      DATABASE_SSL: "false"
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
