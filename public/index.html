<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Whineyard 🍷</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <header class="page-header">
      <div>
        <h1>The Whineyard 🍷</h1>
        <p class="tagline">A place where complaints age to wisdom.</p>
      </div>
      <nav class="page-nav">
        <a href="/dashboard.html">Dashboard</a>
        <a href="/" aria-current="page">Table</a>
      </nav>
    </header>
    <form id="filters" class="filters">
      <label>
        Keyword
        <input name="q" type="text" placeholder="search feedback" />
      </label>
      <label>
        From
        <input name="from" type="date" />
      </label>
      <label>
        To
        <input name="to" type="date" />
      </label>
      <label>
        Tag
        <input name="tag" type="text" placeholder="optional" />
      </label>
      <label>
        Category
        <select name="category">
          <option value="">Any</option>
          <option value="COMPETITOR_CHURN">Competitor churn</option>
          <option value="PRICING">Pricing</option>
          <option value="NO_LONGER_NEEDED">No longer needed</option>
          <option value="ACCIDENT">Accident</option>
          <option value="PERFORMANCE">Performance</option>
          <option value="RELIABILITY">Reliability</option>
          <option value="NOISE">Noise</option>
          <option value="MISSING_FEATURES">Missing features</option>
          <option value="OTHER">Other</option>
        </select>
      </label>
      <label>
        Status
        <select name="status">
          <option value="">Any</option>
          <option>pending</option>
          <option>submitted</option>
          <option>scored</option>
          <option>failed</option>
        </select>
      </label>
      <label>
        Actionability
        <select name="actionability">
          <option value="">Any</option>
          <option>1</option>
          <option>2</option>
          <option>3</option>
          <option>4</option>
          <option>5</option>
        </select>
      </label>
      <label>
        Sort
        <select name="sort">
          <option value="created_at">Created</option>
          <option value="category">Category</option>
          <option value="actionability">Actionability</option>
        </select>
      </label>
      <label>
        Order
        <select name="order">
          <option value="desc">Desc</option>
          <option value="asc">Asc</option>
        </select>
      </label>
      <button type="submit">Apply</button>
    </form>

    <p id="meta" class="meta"></p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Created</th>
            <th>Feedback</th>
            <th>Tags</th>
            <th>Category</th>
            <th>Actionability</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <div class="pager">
      <button type="button" id="prev" disabled>Previous</button>
      <button type="button" id="next" disabled>Next</button>
    </div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
